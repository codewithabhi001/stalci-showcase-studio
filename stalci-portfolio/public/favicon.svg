<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="stalciGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded octagon / squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#stalciGold)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Sovereign STALCI Geometric Hex-Prism Diamond S -->
  <g filter="url(#goldGlow)">
    <!-- Top angled wing -->
    <path d="M 60 22 L 88 38 L 74 46 L 46 30 Z" fill="url(#stalciGold)" />
    <!-- Middle cross spine -->
    <path d="M 32 46 L 74 46 L 88 54 L 46 70 L 32 62 Z" fill="url(#stalciGold)" opacity="0.95" />
    <!-- Bottom angled wing -->
    <path d="M 46 70 L 74 86 L 60 98 L 32 82 Z" fill="url(#stalciGold)" />
    <!-- Core central spark diamond -->
    <polygon points="60,48 70,60 60,72 50,60" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
